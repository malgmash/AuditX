name: auditx

services:
  postgres:
    # pgvector image so the Tier 2 retrieval index needs no new service
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: auditx
      POSTGRES_PASSWORD: auditx
      POSTGRES_DB: auditx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditx -d auditx"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: auditx
      MINIO_ROOT_PASSWORD: auditx-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 auditx auditx-dev-secret &&
      mc mb --ignore-existing local/receipts
      "

volumes:
  postgres-data:
  minio-data:
